<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>魔法貓咪快跑</title>
	<link rel="stylesheet" href="dino-game.css">
</head>
<body>
	<main class="game-shell">
		<header class="game-header">
			<div>
				<p class="eyebrow">HTML5 RUNNER</p>
				<h1>魔法貓咪快跑</h1>
			</div>
			<div class="score-board" aria-label="遊戲分數">
				<div><span>分數</span><strong id="score">00000</strong></div>
				<div><span>最高分</span><strong id="high-score">00000</strong></div>
				<div><span>硬幣</span><strong id="coin-count">000</strong></div>
			</div>
		</header>

		<section class="game-card" aria-label="魔法貓咪遊戲區域">
			<canvas id="game-canvas" width="900" height="320" tabindex="0" aria-label="魔法貓咪遊戲畫布"></canvas>
			<img id="hero-sprite" class="hero-sprite" src="./45.gif" alt="" aria-hidden="true" draggable="false">
			<div id="status" class="status" aria-live="polite">按空白鍵開始</div>
		</section>

		<div class="game-controls">
			<p>空白鍵／↑ 跳躍　↓ 蹲下　P 暫停</p>
			<div class="control-buttons">
				<button id="pause-button" type="button" disabled>暫停</button>
				<button id="sound-button" type="button" aria-pressed="true">音效：開</button>
				<button id="restart-button" type="button">重新開始</button>
			</div>
		</div>
		<div class="touch-controls" aria-label="觸控操作">
			<button id="jump-button" type="button">跳躍</button>
			<button id="duck-button" type="button">按住蹲下</button>
		</div>
	</main>
	<section class="orientation-prompt" aria-labelledby="orientation-title">
		<div>
			<p class="eyebrow">MAGIC CAT RUNNER</p>
			<h2 id="orientation-title">請橫向遊玩</h2>
			<p>將手機轉為橫向，體驗完整跑道。</p>
			<button id="landscape-button" type="button">進入橫向遊戲</button>
		</div>
	</section>

	<script src="dino-game.js" defer></script>
</body>
</html>
